  description: >-
    Subscription-based realtime stream of Tensor marketplace events. Channels include `newTransaction`
    (every confirmed marketplace action), `ammOrderUpdate` / `ammOrderUpdateAll` (TSwap and TAmm pool
    state), `tcompBidUpdate` / `tcompBidUpdateAll` (compressed-NFT collection bids), `ping`, and `unsubscribe`.
    Used to power floor-price feeds, sales bots, and order-book mirroring.
